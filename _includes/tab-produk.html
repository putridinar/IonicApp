  <ion-tab tab="produk">
    <div id="produk-page">
      <ion-header>
        <ion-toolbar>
          <ion-title>Produk</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content style="display: contents;">
        <div class="tab-container">
        <!-- Banner -->
        <div id="banner-container"></div>

        <!-- Grid Produk -->
        <div class="grid-card" id="product-grid"></div>
		</div>
      </ion-content>
    </div>
  </ion-tab>

<!-- Modal untuk Menampilkan Detail Produk -->
<ion-modal id="product-modal" class="fullscreen-modal">
  <div class="modal-content simpleCart_shelfItem">
    <ion-header>
      <ion-toolbar>
        <ion-title id="modal-title"></ion-title>
        <ion-buttons slot="end">
          <ion-button shape="round" onclick="closeModal()">
			<ion-icon slot="icon-only" name="close-circle-outline"></ion-icon>
		  </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding" style="height:80vh;">
      <div class="modal-container">
	  <section class="img-section">
      <img id="modal-img" class="modal-img" />
	  </section>
	  <ion-card class="desc-section">
		  <ion-card-header>
			  <ion-card-title>
				<h2 id="modal-price"></h2>
			  </ion-card-title>
			<ion-card-subtitle id="modal-stok"></ion-card-subtitle>
		  </ion-card-header>
		  <ion-card-content>
			<p id="modal-description"></p>
		  </ion-card-content>
<ion-footer>
		<ion-toolbar>
		  <ion-buttons  slot="start">
			<ion-button fill="clear">Chat Seller</ion-button>
	      </ion-buttons>
		  <ion-buttons  slot="end">
			<ion-button fill="clear">Beli Item</ion-button>
	      </ion-buttons>
		</ion-toolbar>
</ion-footer>
	  </ion-card>
    </div>
    </ion-content>
  </div>
</ion-modal>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const jsonUrl = "/products.json";
    const productGrid = document.getElementById("product-grid");
    const productModal = document.getElementById("product-modal");

    // Elemen modal
    const modalTitle = document.getElementById("modal-title");
    const modalImg = document.getElementById("modal-img");
    const modalPrice = document.getElementById("modal-price");
    const modalStock = document.getElementById("modal-stok");
    const modalDescription = document.getElementById("modal-description");

    fetch(jsonUrl)
      .then((response) => response.json())
      .then((data) => {
        productGrid.innerHTML = data
          .map(
            (grid, index) => `
            <ion-card class="pointer" onclick="openModal(${index})">
              <img class="img-home-grid" alt="${grid.title}" src="${grid.img}" />
              <ion-card-header class="text-center">
                <ion-card-title>${grid.title}</ion-card-title>
                <ion-card-subtitle>Rp. ${grid.harga}</ion-card-subtitle>
              </ion-card-header>
            </ion-card>
          `
          )
          .join("");

        // Simpan data untuk digunakan di modal
        window.products = data;
      })
      .catch((error) => console.error("Error fetching data:", error));

    // Fungsi untuk membuka modal dengan data produk
    window.openModal = function (index) {
      const product = window.products[index];
      modalTitle.textContent = product.title;
      modalImg.src = product.img;
      modalPrice.textContent = `Rp. ${product.harga}`;
      modalStock.textContent = `Stock ${product.stok}`;
      modalDescription.textContent = product.description;
      productModal.present();
    };

    // Fungsi untuk menutup modal
    window.closeModal = function () {
      productModal.dismiss();
    };
  });
</script>
