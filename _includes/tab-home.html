<ion-tab tab="home">
  <div id="home-page">
    <ion-header>
      <ion-toolbar>
        <ion-title>Home</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content style="display: contents;">
      <div class="tab-container">
        <!-- Banner -->
        <div id="banner-container"></div>

        <!-- Grid Produk -->
        <div class="grid-card" id="product-grid"></div>
      </div>
    </ion-content>
  </div>
</ion-tab>

<!-- Modal untuk Menampilkan Detail Produk -->
<ion-modal id="product-modal">
  <div class="modal-content">
    <ion-header>
      <ion-toolbar>
        <ion-title id="modal-title"></ion-title>
        <ion-buttons slot="end">
          <ion-button onclick="closeModal()">Close</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding container-fluid">
      <img id="modal-img" class="modal-img" />
      <div class="text-center">
        <h2 id="modal-price"></h2>
        <p id="modal-description"></p>
      </div>
    </ion-content>
  </div>
</ion-modal>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const jsonUrl = "assets/data/product.json";
    const productGrid = document.getElementById("product-grid");
    const productModal = document.getElementById("product-modal");

    // Elemen modal
    const modalTitle = document.getElementById("modal-title");
    const modalImg = document.getElementById("modal-img");
    const modalPrice = document.getElementById("modal-price");
    const modalDescription = document.getElementById("modal-description");

    fetch(jsonUrl)
      .then((response) => response.json())
      .then((data) => {
        productGrid.innerHTML = data
          .map(
            (grid, index) => `
            <ion-card onclick="openModal(${index})">
              <img class="img-home-grid" alt="${grid.title}" src="${grid.img}" />
              <ion-card-header class="text-center">
                <ion-card-title>${grid.title}</ion-card-title>
                <ion-card-subtitle>Rp. ${grid.harga}</ion-card-subtitle>
              </ion-card-header>
            </ion-card>
          `
          )
          .join("");

        // Simpan data untuk digunakan di modal
        window.products = data;
      })
      .catch((error) => console.error("Error fetching data:", error));

    // Fungsi untuk membuka modal dengan data produk
    window.openModal = function (index) {
      const product = window.products[index];
      modalTitle.textContent = product.title;
      modalImg.src = product.img;
      modalPrice.textContent = `Rp. ${product.harga}`;
      modalDescription.textContent = product.description;
      productModal.present();
    };

    // Fungsi untuk menutup modal
    window.closeModal = function () {
      productModal.dismiss();
    };
  });
</script>
